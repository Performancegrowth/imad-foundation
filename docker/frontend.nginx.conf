server {
    listen 80;
    server_name _;

    # Emit the backend's own (already schema/relative) redirect Location so the
    # API's 307 trailing-slash redirects preserve the original host:port the
    # client used (e.g. localhost:5173) instead of resolving to the internal
    # nginx port 80.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API traffic to the FastAPI backend service.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_redirect off;
        # $http_host (not $host) preserves the client's port so FastAPI's
        # 307 trailing-slash redirects keep e.g. localhost:5173.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI/Interactive docs proxied to the backend.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}