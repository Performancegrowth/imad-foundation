# ==================================================================
# Imad (عِماد) — Full-stack compose (with Ollama + persistent storage)
#   · redis     queue broker for background jobs (Sprint 14)
#   · backend   FastAPI + SQLAlchemy (with healthcheck)
#   · worker    background task processor (same backend image)
#   · ollama    local LLM endpoint for AI-assisted engineering
#   · frontend  React/Vite static build served by nginx (healthcheck)
# ==================================================================
services:
  redis:
    image: redis:7-alpine
    container_name: imad-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [imad-net]

  ollama:
    image: ollama/ollama:latest
    container_name: imad-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks: [imad-net]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: imad-backend
    env_file: .env
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - UPLOAD_DIR=/app/storage/uploads
      - RESULTS_DIR=/app/storage/results
    volumes:
      - ./backend/app:/app/app:ro
      - ./database/schema.sql:/app/database/schema.sql:ro
      - uploads_data:/app/storage/uploads
      - results_data:/app/storage/results
      - jobs_data:/app/storage/jobs   # share job status/results with worker
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [imad-net]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: imad-worker
    env_file: .env
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
      - UPLOAD_DIR=/app/storage/uploads
      - RESULTS_DIR=/app/storage/results
    volumes:
      - ./backend/app:/app/app:ro
      - ./database/schema.sql:/app/database/schema.sql:ro
      - uploads_data:/app/storage/uploads
      - results_data:/app/storage/results
      - jobs_data:/app/storage/jobs   # share job status/results with API
    command: python -m app.core.worker
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [imad-net]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: imad-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks: [imad-net]

# Persistent storage volumes (survive container rebuilds).
volumes:
  ollama_data:
  uploads_data:
  results_data:
  jobs_data:

# Shared bridge network used by every service.
networks:
  imad-net:
    driver: bridge

