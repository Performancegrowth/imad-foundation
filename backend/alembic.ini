# Imad — Alembic (minimal) configuration.
# Script location is copied to the container at /app/migrations (see
# docker/Dockerfile.backend). The database URL is injected at runtime
# from the DATABASE_URL environment variable (see migrations/env.py).

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S